<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173d35">
<title>대학 생활 엿보기 | 라이프복지학과</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--forest:#173d35;--green:#24604f;--lime:#d7ed8a;--cream:#f7f6ef;--ink:#17221e;--muted:#69756f;--line:#dfe3da}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans KR',sans-serif}a{color:inherit;text-decoration:none}.top{background:var(--forest);color:#e5eee5;padding:10px max(calc((100vw - 1180px)/2),24px);font-size:12px}.nav{max-width:1180px;margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:var(--forest);font:700 13px 'DM Sans'}.back{font-size:13px;font-weight:700;color:var(--green)}.hero{background:var(--forest);color:white;padding:66px 24px 58px}.wrap{max-width:1180px;margin:auto}.eyebrow{font:600 11px 'DM Sans';letter-spacing:.2em;color:var(--lime)}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.07em;margin:17px 0 12px}.hero p{margin:0;color:#d0ddd3;font-size:15px;line-height:1.9}.main{max-width:1180px;margin:auto;padding:38px 24px 86px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:28px}.filter{border:1px solid #cad4c9;border-radius:30px;background:transparent;padding:10px 15px;font:600 12px 'Noto Sans KR';color:var(--ink);cursor:pointer}.filter.active,.filter:hover{background:var(--forest);border-color:var(--forest);color:white}.count{font-size:12px;color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid #e6e8df;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #173d3518}.card[hidden]{display:none}.card img{width:100%;height:245px;object-fit:cover;display:block;background:#e8e7de}.caption{padding:14px 16px 16px}.caption b{font-size:14px;display:block;margin-bottom:5px}.caption span{font-size:11px;color:var(--muted)}.badge{display:inline-block;background:#f0f4e6;color:#426447;border-radius:20px;padding:5px 9px;font-size:10px;margin-bottom:9px}.ai .badge{background:#fff1e7;color:#98552e}.note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:28px}.lightbox{position:fixed;inset:0;background:#101714ed;z-index:5;display:none;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox figure{margin:0;max-width:min(1100px,90vw);max-height:90vh;text-align:center;color:white}.lightbox img{max-width:100%;max-height:78vh;object-fit:contain}.lightbox figcaption{padding:12px;font-size:13px}.close,.prev,.next{position:fixed;border:0;background:#ffffff22;color:white;font-size:28px;cursor:pointer;padding:10px 16px}.close{top:18px;right:20px}.prev{left:18px;top:48%}.next{right:18px;top:48%}footer{background:#102f29;color:#cad6cc;padding:28px 24px;font-size:12px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:210px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card img{height:auto;max-height:360px}.hero{padding:50px 24px}.lightbox{padding:12px}.prev{left:2px}.next{right:2px}}
</style>
</head>
<body>
<div class="top">DONG-EUI UNIVERSITY · LIFE WELFARE</div>
<nav class="nav"><a class="brand" href="index.html"><span class="mark">DEU</span> 동의대학교 라이프복지학과</a><a class="back" href="index.html">← 학과 홈페이지</a></nav>
<header class="hero"><div class="wrap"><div class="eyebrow">LIFE ON CAMPUS</div><h1>대학 생활 엿보기</h1><p>강연과 동아리, 현장 실습과 창업 캠프까지<br>함께 배우고 경험한 순간들을 사진으로 만나보세요.</p></div></header>
<main class="main"><div class="filters" role="group" aria-label="사진 분류"><button class="filter active" data-filter="all">전체 56</button><button class="filter" data-filter="lecture">강연·특강 28</button><button class="filter" data-filter="club">교류·동아리 6</button><button class="filter" data-filter="practice">배움·현장실습 4</button><button class="filter" data-filter="startup">창업캠프 5</button><button class="filter" data-filter="ai">축하·기념 이미지 13</button></div><p class="count" id="count">사진 56장</p><div class="grid" id="grid"></div><p class="note">※ 축하·기념 이미지 13장은 AI로 생성한 참고 이미지이며 실제 행사 사진이 아닙니다. 사진은 제공된 자료를 행사별로 모아 구성했습니다.</p></main>
<footer>동의대학교 미래융합대학 라이프복지학과 · <a href="index.html">홈으로</a></footer>
<div class="lightbox" id="lightbox" aria-modal="true" role="dialog"><button class="close" aria-label="닫기">×</button><button class="prev" aria-label="이전 사진">‹</button><figure><img alt=""><figcaption></figcaption></figure><button class="next" aria-label="다음 사진">›</button></div>
<script>
const groups=[
 {start:1,end:28,cat:'lecture',title:'강연·특강',date:'2025년 11월'},
 {start:29,end:33,cat:'club',title:'파크골프 동아리 모임',date:'2025년 12월'},
 {start:34,end:46,cat:'ai',title:'축하·기념 AI 참고 이미지',date:'2025년 12월 · AI 생성'},
 {start:47,end:47,cat:'club',title:'파크골프 동아리 활동',date:'2026년 4월'},
 {start:48,end:51,cat:'practice',title:'라이프복지학과 실습 수업',date:'2026년 6월'},
 {start:52,end:56,cat:'startup',title:'성인학습자 실전 창업캠프',date:'2026년 8월'}
];
const photos=[];for(const g of groups)for(let n=g.start;n<=g.end;n++)photos.push({n,...g});
const grid=document.querySelector('#grid');grid.innerHTML=photos.map((p,i)=>`<article class="card ${p.cat==='ai'?'ai':''}" data-cat="${p.cat}" data-index="${i}" tabindex="0"><img src="images/campus/campus-${String(p.n).padStart(2,'0')}.webp" alt="${p.title} 사진 ${p.n}" loading="lazy"><div class="caption"><span class="badge">${p.title}</span><b>${p.title} · ${String(p.n-p.start+1).padStart(2,'0')}</b><span>${p.date}</span></div></article>`).join('');
const cards=[...document.querySelectorAll('.card')], count=document.querySelector('#count');document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelector('.filter.active').classList.remove('active');btn.classList.add('active');let shown=0;cards.forEach(c=>{const yes=btn.dataset.filter==='all'||c.dataset.cat===btn.dataset.filter;c.hidden=!yes;if(yes)shown++});count.textContent=`사진 ${shown}장`;}));
const box=document.querySelector('#lightbox'), big=box.querySelector('img'), cap=box.querySelector('figcaption');let current=0;function show(i){current=(i+photos.length)%photos.length;const p=photos[current];big.src=`images/campus/campus-${String(p.n).padStart(2,'0')}.webp`;big.alt=p.title;cap.textContent=`${p.title} · ${p.date} (${current+1}/${photos.length})`;box.classList.add('open')}cards.forEach(c=>{c.addEventListener('click',()=>show(Number(c.dataset.index)));c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')show(Number(c.dataset.index))})});box.querySelector('.close').onclick=()=>box.classList.remove('open');box.querySelector('.prev').onclick=()=>show(current-1);box.querySelector('.next').onclick=()=>show(current+1);box.addEventListener('click',e=>{if(e.target===box)box.classList.remove('open')});document.addEventListener('keydown',e=>{if(!box.classList.contains('open'))return;if(e.key==='Escape')box.classList.remove('open');if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script>
</body></html>
